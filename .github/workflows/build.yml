name: Test & build executables

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      EXE: ${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (exact pinned build versions)
        run: |
          pip install -r packaging/requirements-build.txt
          pip install --no-deps .
      - name: Install a virtual display (Linux GUI self-test)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb
      - name: Build executables and self-test both (CLI + GUI)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python packaging/build.py
          else
            python packaging/build.py
          fi
      - name: Smoke test (lock -> verify -> change password -> unlock round trip)
        run: packaging/smoke_test.sh
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup --no-progress -y }
          $ver = python -c "import crunchlock; print(crunchlock.__version__)"
          & "$inno\ISCC.exe" "/DAppVersion=$ver" "/DDistDir=$PWD\dist" "/DIconFile=$PWD\build\icons\crunchlock.ico" packaging\windows\crunchlock.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }
      - name: Test installer (install, check, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Crunchlock-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS=contextmenu,association'
          $app = "$env:LOCALAPPDATA\Programs\Crunchlock"
          if (-not (Test-Path "$app\CrunchlockGUI.exe")) { throw "app not installed in $app" }
          & "$app\crunchlock.exe" genpass
          if ($LASTEXITCODE) { throw "installed CLI failed" }
          $open = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\Crunchlock.LockedFile\shell\open\command').'(default)'
          $ctx = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\*\shell\Crunchlock\command').'(default)'
          $dir = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\Directory\shell\Crunchlock\command').'(default)'
          foreach ($c in @($open, $ctx, $dir)) { if ($c -notlike '*CrunchlockGUI.exe*%1*') { throw "bad shell command: $c" } }
          Write-Host "installed OK: $open"
          $result = Join-Path $env:RUNNER_TEMP "installed-selftest.txt"
          $p = Start-Process "$app\CrunchlockGUI.exe" -ArgumentList '--self-test', $result -Wait -PassThru
          Get-Content $result
          if ($p.ExitCode -ne 0) { throw "installed CrunchlockGUI.exe failed its self-test" }
          Start-Process "$app\unins000.exe" -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\CrunchlockGUI.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\CrunchlockGUI.exe") { throw "uninstall left files behind" }
          if (Test-Path -LiteralPath 'HKCU:\Software\Classes\*\shell\Crunchlock') { throw "uninstall left the context menu" }
          if (Test-Path -LiteralPath 'HKCU:\Software\Classes\Crunchlock.LockedFile') { throw "uninstall left the file association" }
          Write-Host "uninstalled cleanly"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: crunchlock-Windows-installer
          path: dist/Crunchlock-Setup-*.exe
          if-no-files-found: error
      - name: Package
        run: |
          name=crunchlock-${{ runner.os }}-${{ runner.arch }}
          mkdir -p package
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../package/$name.zip" crunchlock.exe CrunchlockGUI.exe
          else
            tar czf "../package/$name.tar.gz" crunchlock CrunchlockGUI
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: crunchlock-${{ runner.os }}
          path: package/*
          if-no-files-found: error

  # macOS is built separately so that a slow or unavailable GitHub macOS machine
  # never holds up (or fails) a release: the Windows and Linux files are attached
  # by the `release` job, and this job attaches the macOS file itself whenever it
  # finishes. A macOS failure shows as a red job but doesn't fail the workflow.
  build-macos:
    needs: test
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (exact pinned build versions)
        run: |
          pip install -r packaging/requirements-build.txt
          pip install --no-deps .
      - name: Build executables and self-test both (CLI + GUI)
        run: python packaging/build.py
      - name: Smoke test (lock -> verify -> change password -> unlock round trip)
        run: packaging/smoke_test.sh
      - name: Package
        run: |
          mkdir -p package
          cd dist && tar czf "../package/crunchlock-macOS-${{ runner.arch }}.tar.gz" crunchlock CrunchlockGUI.app
      - uses: actions/upload-artifact@v4
        with:
          name: crunchlock-macOS
          path: package/*
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: package/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build  # Windows + Linux only; macOS attaches its own file (see build-macos)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: crunchlock-{Windows,Windows-installer,Linux}
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # Only attach files: release notes are written (or generated) when the
          # release is published in the GitHub UI, so don't add a second copy.
