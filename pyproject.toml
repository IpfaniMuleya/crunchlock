[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crunchlock"
version = "1.0.5"
description = "Lossless compression + strong authenticated encryption into small, secure .clk files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "zstandard>=0.22",
    "reedsolo>=1.7",
    "numpy>=1.24",
    "sv-ttk>=2.6",
    "tkinterdnd2>=0.4",
    "imagecodecs>=2024.1.1",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
crunchlock = "crunchlock.cli:main"

[project.gui-scripts]
crunchlock-gui = "crunchlock.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crunchlock = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
